# Per-cluster CNPG overrides for hetzner-starter.
# Storage nodes + storage class aliases enabled for E2E test.

backup:
  enabled: true
  schedule: "0 0 2 * * *"

cluster:
  storage:
    storageClass: fast-rwo
  walStorage:
    storageClass: fast-rwo
  nodeSelector:
    k8s-platform/pool-role: storage
  tolerations:
    - key: k8s-platform/pool-role
      operator: Equal
      value: storage
      effect: NoSchedule
