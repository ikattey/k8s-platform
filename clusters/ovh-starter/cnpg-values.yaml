# Per-cluster CNPG overrides for ovh-starter.
#
# The OVH platform module injects the backup bucket name at bootstrap time, so
# only the enablement and schedule need to be set here.
backup:
  enabled: true
  schedule: "0 0 2 * * *"

# Uncomment when enable_storage_pool = true:
# cluster:
#   nodeSelector:
#     k8s-platform/pool-role: storage
#   tolerations:
#     - key: k8s-platform/pool-role
#       operator: Equal
#       value: storage
#       effect: NoSchedule
