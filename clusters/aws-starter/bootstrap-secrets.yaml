# 1Password item names for aws-starter bootstrap secrets.

secrets:
  grafanaAdmin:
    onepasswordItem: "grafana-aws-starter"
  grafanaOAuth:
    enabled: false
    onepasswordItem: "grafana-oidc-aws-starter"
  cloudflareApiToken:
    onepasswordItem: "cloudflare-dns-aws-starter"
  argocdOidc:
    enabled: false
    onepasswordItem: "argocd-oidc-aws-starter"
  database:
    enabled: false
    onepasswordItem: "database-aws-starter"
  alertmanagerSlackWebhook:
    enabled: false
    onepasswordItem: "alertmanager-slack-aws-starter"
