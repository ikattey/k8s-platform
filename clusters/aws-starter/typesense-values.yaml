# Per-cluster Typesense overrides for aws-starter.
#
# Typesense runs on general-purpose nodes by default. If you enable a dedicated
# storage node pool, uncomment the nodeSelector and tolerations below.

# typesense:
#   nodeSelector:
#     k8s-platform/pool-role: storage
#   tolerations:
#     - key: k8s-platform/pool-role
#       operator: Equal
#       value: storage
#       effect: NoSchedule

typesense:
  auth:
    createSecret: true
    apiKey: "aws-starter-e2e-typesense-key"
