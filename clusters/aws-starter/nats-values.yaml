# Per-cluster NATS overrides for aws-starter.
#
# Pins NATS JetStream to the dedicated storage node group.

nats:
  jetstream:
    storage:
      storageClass: standard-rwo
  nodeSelector:
    k8s-platform/pool-role: storage
  tolerations:
    - key: k8s-platform/pool-role
      operator: Equal
      value: storage
      effect: NoSchedule
