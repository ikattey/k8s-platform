# Per-cluster CNPG overrides for aws-starter.
#
# This overlay assumes the AWS cluster was created with a dedicated storage node
# group and the fast-rwo StorageClass alias.

backup:
  enabled: true
  schedule: "0 0 2 * * *"

cluster:
  storage:
    storageClass: fast-rwo
  walStorage:
    storageClass: fast-rwo
  nodeSelector:
    k8s-platform/pool-role: storage
  tolerations:
    - key: k8s-platform/pool-role
      operator: Equal
      value: storage
      effect: NoSchedule
