# Per-cluster CNPG overrides for gcp-starter.

backup:
  enabled: true
  schedule: "0 0 2 * * *"
  destinationPath: "gs://gcp-starter-backups-af2434df/postgres/"
  # GCS credentials via Workload Identity service account key.
  # Create the secret before enabling backup:
  #   kubectl create secret generic cnpg-gcs-credentials \
  #     --from-file=serviceaccount.json=<sa-key.json> -n database
  googleCredentials:
    applicationCredentials:
      name: cnpg-gcs-credentials
      key: serviceaccount.json

# Uncomment for fast storage (requires storage class aliases, created by default on GCP):
# cluster:
#   storage:
#     storageClass: fast-rwo
#   walStorage:
#     storageClass: fast-rwo

# Uncomment when enable_storage_node_pool = true:
#   nodeSelector:
#     k8s-platform/pool-role: storage
#   tolerations:
#     - key: k8s-platform/pool-role
#       operator: Equal
#       value: storage
#       effect: NoSchedule
