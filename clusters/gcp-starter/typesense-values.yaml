# Per-cluster Typesense overrides for gcp-starter.
#
# Pins Typesense to the dedicated storage node pool.
# Requires enable_storage_node_pool = true in cluster terraform.tfvars.

typesense:
  storage:
    storageClass: fast-rwo
  nodeSelector:
    k8s-platform/pool-role: storage
  tolerations:
    - key: k8s-platform/pool-role
      operator: Equal
      value: storage
      effect: NoSchedule
