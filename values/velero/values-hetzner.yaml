# Hetzner cloud overlay for Velero
# Use File System Backup / Data Mover against S3-compatible object storage.

credentials:
  useSecret: true
  existingSecret: velero-cloud-credentials

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocations:
    - name: default
      spec:
        provider: aws
        default: true
        objectStorage:
          bucket: velero-backups
        accessMode: ReadWrite
        config:
          region: fsn1
          s3Url: https://fsn1.your-objectstorage.com
          s3ForcePathStyle: "true"
          checksumAlgorithm: ""
  volumeSnapshotLocations: []

defaultVolumesToFsBackup: true
