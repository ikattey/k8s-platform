# GCP cloud overlay for Velero
# Use GCS for backup metadata/data movement and GCE PD snapshots for CSI movement.

credentials:
  useSecret: false

initContainers:
  - name: velero-plugin-for-gcp
    image: velero/velero-plugin-for-gcp:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocation:
    - name: default
      provider: gcp
      bucket: velero-backups
      prefix: velero
      default: true
      accessMode: ReadWrite
      # serviceAccount set by Terraform via ArgoCD valuesObject (Workload Identity)
  volumeSnapshotLocation:
    - name: default
      provider: gcp
      config:
        project: ""
        snapshotLocation: ""

defaultVolumesToFsBackup: false
