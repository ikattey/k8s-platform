# AWS cloud overlay for Velero
# Use S3 for backup metadata/data movement and EBS snapshots for CSI movement.

credentials:
  useSecret: false

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
  - name: velero-plugin-for-csi
    image: velero/velero-plugin-for-csi:v0.7.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  backupStorageLocations:
    - name: default
      spec:
        provider: aws
        default: true
        objectStorage:
          bucket: velero-backups
        accessMode: ReadWrite
        config:
          region: eu-west-1
  volumeSnapshotLocations:
    - name: default
      spec:
        provider: aws
        config:
          region: eu-west-1

defaultVolumesToFsBackup: false
