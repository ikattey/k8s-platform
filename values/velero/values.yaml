# Velero - installed as a migration/data-movement tool.
#
# Platform stance:
# - CSI Snapshot Data Movement by default on clouds with first-class CSI snapshots
# - File System Backup (FSB) fallback on clouds where snapshots are weak or unavailable
# - App-native migration remains an override for specific workloads
#
# Bucket names and cloud-provider config are injected from Terraform and the
# cloud-specific values file.

image:
  repository: velero/velero
  tag: v1.15.2
  pullPolicy: IfNotPresent

serviceAccount:
  server:
    create: false
    name: velero

credentials:
  useSecret: false

backupsEnabled: true
snapshotsEnabled: true

features: EnableCSI

uploaderType: kopia
defaultVolumesToFsBackup: false
deployNodeAgent: true

initContainers: []

configuration:
  # velero chart 8.x uses singular keys: backupStorageLocation / volumeSnapshotLocation
  # Fields are flat (no spec: nesting). Cloud overlays override provider, bucket, config.
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: CHANGEME
      default: true
      accessMode: ReadWrite
  volumeSnapshotLocation: []

server:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi

nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 2048Mi
  tolerations:
    - operator: Exists

# Disable the CRD upgrade job — bitnami/kubectl tags use full patch versions
# (e.g. 1.31.3) not minor-only tags, so the chart's auto-detected tag fails.
# CRDs are managed by Helm's native crds/ mechanism on fresh installs.
upgradeCRDs: false

schedules: {}
