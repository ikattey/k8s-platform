replicaCount: 2

image:
  repository: ghcr.io/masena-dev/k8s-platform-demo-app
  tag: "main-8471417"
  pullPolicy: IfNotPresent

containerPort: 8080

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  hosts:
    - host: demo.your-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: demo-app-tls
      hosts:
        - demo.your-domain.com

# Database configuration
# When enabled, injects DATABASE_WRITE_URL and DATABASE_READ_URL from the named secret.
# Supports both managed PostgreSQL (via 1Password/ESO) and CNPG.
databaseSecret:
  enabled: false
  name: database-credentials

# Data layer services (all optional, disabled by default)
valkey:
  enabled: false
  addr: "valkey.cache:6379"

typesense:
  enabled: false
  addr: "typesense.search:8108"
  apiKey: ""
  secretName: ""       # K8s secret containing TYPESENSE_API_KEY
  secretKey: "api-key"

nats:
  enabled: false
  url: "nats://nats.messaging:4222"
  secretName: ""  # secret containing NATS_URL; set when URL includes auth credentials

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
