apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
          {{- if .Values.databaseSecret.enabled }}
            - name: DATABASE_WRITE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: DATABASE_WRITE_URL
            - name: DATABASE_READ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: DATABASE_READ_URL
          {{- end }}
          {{- if .Values.valkey.enabled }}
            - name: REDIS_ADDR
              value: {{ .Values.valkey.addr | quote }}
          {{- end }}
          {{- if .Values.typesense.enabled }}
            - name: TYPESENSE_ADDR
              value: {{ .Values.typesense.addr | quote }}
            {{- if .Values.typesense.secretName }}
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.typesense.secretName }}
                  key: TYPESENSE_API_KEY
            {{- end }}
          {{- end }}
          {{- if .Values.nats.enabled }}
            - name: NATS_URL
              {{- if .Values.nats.secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nats.secretName }}
                  key: NATS_URL
              {{- else }}
              value: {{ .Values.nats.url | quote }}
              {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
