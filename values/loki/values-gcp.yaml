# GCP cloud overlay for Loki
# Use Google Cloud Storage and Workload Identity.

serviceAccount:
  create: false
  name: loki

loki:
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: gcs
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: gcs
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
    gcs:
      bucket_name: loki-chunks
  storage_config:
    gcs:
      bucket_name: loki-chunks
  compactor:
    delete_request_store: gcs
