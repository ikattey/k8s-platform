# CNPG PostgreSQL Cluster
# Deploys a Cluster CRD, optional PgBouncer Pooler, and ScheduledBackup.
#
# Auto-tuning: PostgreSQL parameters are calculated from memory requests
# using the formula in _helpers.tpl (shared_buffers=25%, effective_cache_size=75%).

cluster:
  name: postgres
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  instances: 1
  bootstrap:
    database: app
    owner: app
    credentialsSecretName: "postgres-app-bootstrap"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  storage:
    size: 20Gi
    # storageClass: "" # Uses cluster default (cloud-agnostic)

  walStorage:
    size: 5Gi
    storageClass: ""  # Defaults to same as storage.storageClass if empty

  # Node scheduling (overridden by cloud overlays or per-cluster values)
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Service account annotations for generated cluster service accounts.
  # Leave empty when you annotate the namespace default service account instead.
  serviceAccountAnnotations: {}

  postgresql:
    # Additional parameters beyond auto-tuned ones
    parameters:
      max_connections: "200"
      work_mem: "4MB"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      log_statement: "ddl"
      log_min_duration_statement: "1000"

  monitoring:
    enabled: true

# PgBouncer connection poolers
pooler:
  enabled: true
  instances: 2
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"

# Automated backups to object storage
# WARNING: Backups are disabled by default. Enable this before using CNPG
# in production. See docs/backups.md for the full setup procedure.
backup:
  enabled: false
  provider: "s3"             # s3 or gcs
  schedule: "0 0 2 * * *"    # Daily at 2 AM UTC
  retentionPolicy: "30d"
  compression: "bzip2"
  immediate: false
  suspend: false
  inheritFromIAMRole: false  # IRSA / IMDS-backed AWS credentials
  googleCredentials: {}      # Optional explicit SecretKeySelector map for JSON credentials
  destinationPath: ""
  endpointURL: ""
  # AWS S3 / S3-compatible
  s3:
    region: ""
    accessKeyId: ""
    secretAccessKey: ""
