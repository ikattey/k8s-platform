# GCP cloud overlay for CNPG
# Backups use Google Cloud Storage. Prefer Workload Identity so the cluster
# service account can obtain credentials without static JSON keys.

backup:
  provider: gcs
  destinationPath: "gs://cnpg-backups/postgres/"

cluster:
  storage:
    storageClass: fast-rwo
  walStorage:
    storageClass: fast-rwo
