{{- if .Values.typesense.auth.createSecret }}
{{- if eq .Values.typesense.auth.apiKey "CHANGE-ME-use-external-secrets" }}
{{- fail "typesense.auth.apiKey is still set to the placeholder value. Prefer syncing typesense-admin-key via bootstrap-secrets/ExternalSecret and set typesense.auth.createSecret=false." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.typesense.auth.apiKeySecretRef.name }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{ .Values.typesense.auth.apiKeySecretRef.key }}: {{ .Values.typesense.auth.apiKey | quote }}
{{- end }}
