apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.letsencryptEmail | quote }}
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      {{- if eq .Values.solver "dns01-cloudflare" }}
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ .Values.cloudflareApiTokenSecretName | quote }}
              key: {{ .Values.cloudflareApiTokenSecretKey | quote }}
      {{- else }}
      - http01:
          ingress:
            class: traefik
      {{- end }}
---
