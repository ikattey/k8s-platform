{{- if .Values.components.demoApp }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  sources:
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: values/demo-app
      helm:
        valuesObject:
          ingress:
            enabled: true
            annotations:
              cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer | quote }}
            hosts:
              - host: {{ printf "demo-%s.%s" .Values.clusterName .Values.domain | quote }}
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: demo-app-tls
                hosts:
                  - {{ printf "demo-%s.%s" .Values.clusterName .Values.domain | quote }}
          {{- if .Values.databaseEnabled }}
          databaseSecret:
            enabled: true
          {{- end }}
          {{- if .Values.components.valkey }}
          valkey:
            enabled: true
          {{- end }}
          {{- if .Values.components.typesense }}
          typesense:
            enabled: true
          {{- end }}
          {{- if .Values.components.nats }}
          nats:
            enabled: true
          {{- end }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
---
