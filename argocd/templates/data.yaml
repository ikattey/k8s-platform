{{- if .Values.components.cnpg }}
{{- $backupProvider := ternary "s3" (default "s3" .Values.objectStorage.provider) (eq .Values.cloudProvider "gcp") }}
{{- $backupScheme := ternary "gs" $backupProvider (eq $backupProvider "gcs") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  sources:
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      path: values/cnpg/cluster
      helm:
        ignoreMissingValueFiles: true
        valueFiles:
          - values.yaml
          - values-{{ .Values.cloudProvider }}.yaml
          - $values/clusters/{{ .Values.clusterName }}/cnpg-values.yaml
        {{- if .Values.cnpgBackupBucketName }}
        parameters:
          - name: backup.destinationPath
            value: {{ printf "%s://%s/postgres/" $backupScheme .Values.cnpgBackupBucketName | quote }}
          - name: backup.provider
            value: {{ $backupProvider | quote }}
          {{- if and (eq $backupProvider "s3") .Values.objectStorage.endpoint }}
          - name: backup.endpointURL
            value: {{ .Values.objectStorage.endpoint | quote }}
          {{- end }}
          {{- if and (eq $backupProvider "s3") .Values.objectStorage.region }}
          - name: backup.s3.region
            value: {{ .Values.objectStorage.region | quote }}
          {{- end }}
        {{- end }}
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
---
{{- if .Values.components.valkey }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  sources:
    - repoURL: https://valkey.io/valkey-helm/
      chart: valkey
      targetRevision: {{ .Values.versions.valkey | default "0.9.3" }}
      helm:
        releaseName: valkey
        ignoreMissingValueFiles: true
        valueFiles:
          - $values/values/valkey/values.yaml
          - $values/values/valkey/values-{{ .Values.cloudProvider }}.yaml
          - $values/clusters/{{ .Values.clusterName }}/valkey-values.yaml
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cache
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
